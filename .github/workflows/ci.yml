name: Vyavahaar CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Backend: pytest + live smoke test
  # ─────────────────────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend API & NLU Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Required so 'from app.xxx import ...' resolves correctly in all steps.
      PYTHONPATH: "."
      # Prevents any host-installed pytest plugins (e.g. ROS launch_testing)
      # from auto-loading and crashing the test runner. Safe on all platforms.
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Backend Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize SQLite Database
        run: python app/db_init.py

      - name: Run Backend Automated Tests (Pytest)
        run: pytest tests/test_api.py -v -p asyncio

      - name: Start Backend for Smoke Test
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          # Wait until health endpoint responds (up to 15s)
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "Backend is up after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run Live API Smoke Test
        working-directory: "."
        run: bash scripts/smoke_test.sh http://127.0.0.1:8000

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Android: Gradle configuration check (no SDK compile, just task graph)
  # ─────────────────────────────────────────────────────────────────────────────
  android-build-check:
    name: Android Gradle Configuration Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties (point to GitHub-hosted Android SDK)
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "Wrote sdk.dir=$ANDROID_HOME to local.properties"

      - name: Verify Gradle Task Graph
        working-directory: android
        run: ./gradlew tasks --no-daemon --stacktrace
