[pytest]
# NOTE: Do NOT add '-p no:...' flags here for ROS plugins.
# On systems without ROS, '-p no:missing_plugin' causes an INTERNAL ERROR crash.
# ROS plugin interference is handled by setting PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
# in the environment (see scripts/run_backend_tests.sh and .github/workflows/ci.yml).
testpaths = tests
pythonpath = .
asyncio_mode = auto
